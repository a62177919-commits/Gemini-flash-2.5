name: Gemini AI Bot 24/7

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */4 * * *' # Перезапуск каждые 4 часа автоматически
  workflow_dispatch:      # Кнопка ручного запуска

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Если бот упадет, GitHub попробует поднять его еще раз (до 3 попыток)
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyTelegramBotAPI requests

      - name: Run Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        # Таймаут на 350 минут (чуть меньше 6 часов лимита GitHub)
        run: timeout 350m python bot.py || true
        
